name: Mirror upstream to Gitee
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream
        run: git clone --mirror https://github.com/QuantumNous/new-api.git repo.git

      - name: Push mirror to Gitee
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          cd repo.git
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/new-api-dev.git"
          git push --mirror gitee
